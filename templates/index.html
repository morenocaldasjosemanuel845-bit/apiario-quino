<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Apiario Quino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="contenedor">
        <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Logo Apiario Quino" class="logo">
        <h1>Bienvenido a Apiario Quino</h1>

        <div class="productos">
            {% for producto in productos %}
                <div class="producto">
                    {% if producto.imagen %}
                        <img src="{{ url_for('static', filename='uploads/' + producto.imagen) }}" alt="{{ producto.nombre }}">
                    {% endif %}
                    <h2>{{ producto.nombre }}</h2>
                    <p>S/ {{ "%.2f"|format(producto.precio) }}</p>
                    <a href="{{ url_for('comprar', id=producto.id) }}">Agregar al carrito</a>
                </div>
            {% endfor %}
        </div>

        <p>
            <a href="{{ url_for('ver_carrito') }}">Ver carrito</a> |
            <a href="{{ url_for('admin_productos') }}">Administrar productos</a>
        </p>
    </div>
</body>
</html>
