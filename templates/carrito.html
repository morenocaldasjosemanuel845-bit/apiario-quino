<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Apiario Quino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Carrito de compras</h1>
        <p>Revisa tu pedido antes de enviarlo por WhatsApp</p>
    </header>

    <main>
        {% if carrito %}
            <div class="productos">
                {% for producto in carrito %}
                <div class="card">
                    <h3>{{ producto.nombre }}</h3>
                    <p>Precio: S/ {{ "%.2f"|format(producto.precio) }}</p>
                </div>
                {% endfor %}
            </div>

            <h2 style="margin-top: 30px;">
                Total: S/ {{ "%.2f"|format(total) }}
            </h2>

            <div style="margin-top: 20px;">
                <a href="{{ url_for('enviar_whatsapp') }}">
                    <button style="background-color: #25D366;">Realizar pedido por WhatsApp</button>
                </a>

                <a href="{{ url_for('vaciar_carrito') }}">
                    <button>Vaciar carrito</button>
                </a>

                <a href="{{ url_for('inicio') }}">
                    <button>Seguir comprando</button>
                </a>
            </div>
        {% else %}
            <p>No hay productos en el carrito.</p>
            <a href="{{ url_for('inicio') }}">
                <button>Volver a la tienda</button>
            </a>
        {% endif %}
    </main>
</body>
</html>
